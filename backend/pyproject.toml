[project]
name = "my-alpha-backend"
version = "0.1.0"
description = "my-alpha API: portfolios, screener, analytics and backtests on Yahoo Finance data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "yfinance>=1.7",
    "pandas>=2.2",
    "numpy>=2.0",
    "cachetools>=5.5",
    "alembic>=1.13",
    "PyPortfolioOpt>=1.6",
    "pyfolio-reloaded>=0.9.9",
    # PyPortfolioOpt 1.6 HRPOpt uses scipy.cluster.hierarchy._LINKAGE_METHODS, removed in scipy 1.18.
    "scipy<1.18",
    "statsmodels>=0.14",
    "arch>=7.0",
    # Portfolio allocation / rebalancing backtests (services/backtest/portfolio.py).
    "bt>=1.4",
    # Transaction spreadsheet import (pandas.read_excel engine + multipart file uploads).
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
# fastapi.testclient needs httpx.
dev = ["httpx>=0.27"]

[tool.uv]
# An application, not a library: install the dependencies only.
package = false
